version: '3.8'

services:
  # Monolithic App (API + Worker via PM2)
  ai-app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_REGION=us-east-1
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MINIO_BUCKET=aiagent
      # Note: Set DATABASE_URL and GEMINI_API_KEY in your .env file or deployment environment
    env_file:
      - .env
    depends_on:
      - redis
      - minio
    networks:
      - ai-network
    restart: always

  # Redis for BullMQ & Smart Cache
  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory 100mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - ai-network
    restart: always

  # MinIO for Cloud Object Storage
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    volumes:
      - minio_data:/data
    networks:
      - ai-network
    restart: always

  # Cloudflare Tunnel for secure public access
  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate --url http://ai-app:3000
    networks:
      - ai-network
    restart: always

networks:
  ai-network:
    driver: bridge

volumes:
  redis_data:
  minio_data:
